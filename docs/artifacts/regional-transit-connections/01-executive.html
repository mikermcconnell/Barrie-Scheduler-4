</style></head><body data-variant="1"><div id="app"></div><noscript>This interactive design preview requires JavaScript.</noscript><script>'use strict';
// Deliberately fictional fixtures. No app imports, network calls, persistence, or schedule writes.
const hubs=[{id:'allandale',name:'Allandale Waterfront GO',provider:'GO Transit · Barrie line',short:'Allandale Waterfront',walk:4,note:'Morning departures mostly connect well. One train leaves only 2 minutes after the platform walk.'},{id:'south',name:'Barrie South GO',provider:'GO Transit · Barrie line',short:'Barrie South',walk:4,note:'Review the first morning connection and one 32-minute evening wait.'},{id:'downtown',name:'Downtown Transit Terminal',provider:'Simcoe County LINX · example service',short:'Downtown Terminal',walk:3,note:'One tight transfer. One return trip cannot be assessed because its local departure is missing.'}];
// Each event is one regional trip and its illustrative best local connection.
const events=[
{id:1,hub:'allandale',dir:'to',route:'8A',local:'06:12',regional:'06:30',service:'Train to Union',status:'good'},
{id:2,hub:'allandale',dir:'to',route:'8A',local:'07:24',regional:'07:30',service:'Train to Union',status:'tight'},
{id:3,hub:'allandale',dir:'from',route:'8B',regional:'17:42',local:'17:55',service:'Train from Union',status:'good'},
{id:4,hub:'allandale',dir:'from',route:'8B',regional:'18:42',local:'18:55',service:'Train from Union',status:'good'},
{id:5,hub:'south',dir:'to',route:'100',local:'06:29',regional:'06:30',service:'Train to Union',status:'review'},
{id:6,hub:'south',dir:'to',route:'100',local:'07:12',regional:'07:30',service:'Train to Union',status:'good'},
{id:7,hub:'south',dir:'from',route:'100',regional:'17:24',local:'18:00',service:'Train from Union',status:'review'},
{id:8,hub:'south',dir:'from',route:'100',regional:'18:24',local:'18:40',service:'Train from Union',status:'good'},
{id:9,hub:'downtown',dir:'to',route:'2',local:'08:05',regional:'08:20',service:'LINX toward regional destination',status:'good'},
{id:10,hub:'downtown',dir:'to',route:'7',local:'09:15',regional:'09:20',service:'LINX toward regional destination',status:'tight'},
{id:11,hub:'downtown',dir:'from',route:'2',regional:'16:45',local:'17:00',service:'LINX into Barrie',status:'good'},
{id:12,hub:'downtown',dir:'from',route:'7',regional:'18:45',local:null,service:'LINX into Barrie',status:'unknown'}];
const labels={good:'Comfortable',tight:'Tight',review:'Needs review',unknown:'Not assessed'};
const descriptions={1:'Executive summary',2:'Location scorecards',3:'Rider journeys'};
let direction='all',locationFilter='all',selected=1;
const variant=Number(document.body.dataset.variant)||1;
const hubOf=e=>hubs.find(h=>h.id===e.hub);
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const time=t=>t?`${t} ${Number(t.slice(0,2))<12?'AM':'PM'}`:'Not available';
// Display 12-hour time, while keeping service-day fixture values explicit in the source.
const fmt=t=>{if(!t)return 'Not available';const [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
const add=(t,n)=>{const x=mins(t)+n;return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;};
const wait=e=>e.local?(e.dir==='to'?mins(e.regional)-mins(e.local):mins(e.local)-mins(e.regional))-hubOf(e).walk:null;
const badge=e=>`<span class="badge ${e.status}">${labels[e.status]}</span>`;
const counts=list=>Object.fromEntries(Object.keys(labels).map(s=>[s,list.filter(e=>e.status===s).length]));
const visible=()=>events.filter(e=>(direction==='all'||e.dir===direction)&&(locationFilter==='all'||e.hub===locationFilter));
const route=e=>`<span class="route r${e.route.startsWith('8')?'8':e.route}">${e.route}</span>`;
const directionText=e=>e.dir==='to'?'To regional service':'From regional service';
const gapText=e=>{const w=wait(e);return w===null?'Missing local departure':w<0?`${-w} min short of making it`:`${w} min after walking`;};
const reason=e=>e.status==='unknown'?'Confirm the local departure and stop match before assessing this trip.':wait(e)<0?'The rider reaches the platform after departure. Ask planning to review an earlier local arrival; no schedule change is applied.':wait(e)>20?'The bus is reachable, but the wait exceeds the illustrative 20-minute target. Ask planning to review the return connection.':e.status==='tight'?'The connection works on paper, but has little margin for delays. Review with the planner.':'A reasonable scheduled transfer margin. Keep this connection when reviewing future schedule changes.';

document.getElementById('app').innerHTML=`
<header class="reviewbar"><div><strong>DESIGN REVIEW</strong> ${String(variant).padStart(2,'0')} / 03 · ${descriptions[variant]}</div><nav class="versions" aria-label="Compare designs">${[1,2,3].map(v=>`<a href="0${v}-${['executive','locations','journeys'][v-1]}.html" ${v===variant?'aria-current="page"':''}>${v}. ${['Summary','Locations','Journeys'][v-1]}</a>`).join('')}</nav></header>
<main class="shell"><div class="app-heading"><h1>Master Schedule</h1><p class="muted">Source of truth for all route schedules</p></div>
<nav class="tabs" aria-label="Master Schedule preview"><button disabled title="Context only in this mockup">Overview</button><button disabled title="Context only in this mockup">Platforms</button><span class="active" aria-current="page">Regional Transit Connections</span>${['400','100','101','2','7','8A','8B','10','11','12'].map(r=>`<button disabled title="Context only in this mockup">${r}</button>`).join('')}</nav>
<div class="page-heading"><div><div class="eyebrow">${variant===1?'Management overview':variant===2?'Key transfer locations':'The rider experience'}</div><h2>Regional transit connections</h2><p class="muted">${variant===1?'Where the master schedule connects well — and where it needs attention.':variant===2?'See the connection picture at each key location.':'See exactly how a rider transfers between local and regional service.'}</p></div><button class="btn" id="print">Print summary</button></div>
<div class="notice"><strong>Illustrative data only</strong><span>Not an analysis of your current master schedule or provider feeds. Times, routes, stop pairings and results are fictional.</span></div>
<div class="toolbar"><div class="filtergroup"><div class="segmented" role="group" aria-label="Travel direction"><button data-direction="all" aria-pressed="true">Both directions</button><button data-direction="to" aria-pressed="false">To regional</button><button data-direction="from" aria-pressed="false">From regional</button></div><label class="selectwrap">Location <select id="location"><option value="all">All locations</option>${hubs.map(h=>`<option value="${h.id}">${h.short}</option>`).join('')}</select></label></div><div class="date"><strong>Monday, October 5, 2026 · Weekday</strong>Example master snapshot × example static GTFS</div></div>
<div id="content" aria-live="polite"></div>
<details class="source"><summary>Sources & assessment rules · sample assumptions</summary><div class="inside"><strong>Inputs:</strong> fictional published master snapshot and fictional GO Transit / Simcoe County LINX static GTFS snapshots. No feeds have been imported. Example service date: October 5, 2026; times are local.<br><strong>Counting:</strong> 12 sampled regional trip events across 3 locations, 6 in each direction. Each is assessed against one illustrative best local trip. These are trip opportunities, not rider counts or all-day coverage.<br><strong>Transfer rule:</strong> allow 4 minutes to walk at GO stations and 3 at Downtown Terminal. Then classify remaining time: 5–20 min = comfortable; 0–4 min = tight; below 0 = cannot make the transfer; above 20 min = long wait. Missing data = not assessed and excluded from the assessed percentage. These are proposed planning rules, not approved standards.<br><strong>Before implementation:</strong> confirm providers and exact agency-scoped stop pairings, walking / boarding allowances, wheelchair access, and acceptable waits. Match a real calendar date against GTFS service calendars and exceptions, provider time zones and overnight trips. Show feed validity, import date and each master route version. Expired feeds or unmatched stops must remain not assessed.<br><strong>Boundary:</strong> static schedules indicate potential connections, not observed reliability, guaranteed transfers, passenger demand, or real-time operations. This is a read-only management view; edits stay in the existing draft → review → publish workflow.</div></details>
<footer class="footer"><span>Read-only planning concept · No schedule changes · No live feed connection</span><span>${descriptions[variant]} · Choose the layout before implementation</span></footer></main>
<dialog id="detail-dialog" aria-label="Connection detail"><div class="dialogbody"><button class="btn close" id="close-dialog">Close</button><div id="dialog-content"></div></div></dialog>`;

function metricCards(list){const c=counts(list);return `<div class="metrics"><div class="metric good"><div class="eyebrow">Comfortable</div><div class="number">${c.good}<span class="tiny muted"> / ${list.length} trips</span></div><small>5–20 min remaining after walking</small></div><div class="metric tight"><div class="eyebrow">Tight transfers</div><div class="number">${c.tight}</div><small>0–4 min margin after walking</small></div><div class="metric review"><div class="eyebrow">Needs review</div><div class="number">${c.review}</div><small>Cannot connect or wait is too long</small></div><div class="metric"><div class="eyebrow">Not assessed</div><div class="number">${c.unknown}</div><small>Missing timing or stop-match data</small></div></div>`;}
function tripButton(e,text='View connection →'){return `<button class="linkbutton" data-detail="${e.id}">${text}</button>`;}
function takeaway(list){const c=counts(list),assessed=list.length-c.unknown;return `<div class="takeaway"><div class="marker" aria-hidden="true">↗</div><div><h3>${c.review+c.tight?`${c.review+c.tight} connections merit a planner’s review.`:'No timing issues in this sample.'}</h3><p>${c.good} of ${assessed} assessed trips have a comfortable transfer${c.unknown?`; ${c.unknown} more cannot yet be assessed`:''}. ${list.some(e=>e.id===5)?'Prioritize the first morning departure at Barrie South: the sample rider reaches the platform 3 minutes too late.':c.review+c.tight?'Review timing gaps before considering schedule adjustments.':'Preserve these comfortable connections in future schedule reviews.'}</p></div></div>`;}
function management(list){return metricCards(list)+takeaway(list)+`<div class="section-heading"><h3>Connection summary by location</h3><span class="tiny muted">${list.length} sample regional trips in view</span></div><div class="panel table-scroll"><table><thead><tr><th scope="col">Transfer location</th><th scope="col">Travel direction</th><th scope="col">Comfortable</th><th scope="col">Tight</th><th scope="col">Review</th><th scope="col">Unknown</th></tr></thead><tbody>${hubs.filter(h=>list.some(e=>e.hub===h.id)).map(h=>['to','from'].filter(d=>list.some(e=>e.hub===h.id&&e.dir===d)).map(d=>{const subset=list.filter(e=>e.hub===h.id&&e.dir===d),c=counts(subset);return `<tr><td><strong>${h.short}</strong><small>${h.provider}</small></td><td>${d==='to'?'Local → regional':'Regional → local'}</td><td class="text-good">${c.good}</td><td class="text-tight">${c.tight||'—'}</td><td class="text-review">${c.review||'—'}</td><td>${c.unknown||'—'}</td></tr>`;}).join('')).join('')}</tbody></table></div><div class="bottom-grid"><section class="panel"><div class="panel-head"><h3>Priority connections to review</h3><span class="tiny muted">Timing gaps first</span></div>${list.filter(e=>e.status==='review'||e.status==='tight').sort((a,b)=>(a.status==='review'?0:1)-(b.status==='review'?0:1)).map((e,i)=>`<div class="issue"><span class="index">${i+1}</span><div><strong>${hubOf(e).short} · ${e.service}</strong><p>Route ${e.route} · ${fmt(e.regional)} · ${gapText(e)}</p>${tripButton(e)}</div></div>`).join('')||'<p class="empty">No timing issues in this selection.</p>'}</section><section class="panel method"><h3>What the numbers mean</h3><p>One regional trip is one connection opportunity. Both directions matter: getting to a train or regional bus, and getting home from it.</p><p>Walking time is deducted before judging the transfer. Long waits and impossible transfers are flagged separately in the details.</p><div class="legend">${Object.keys(labels).map(status=>badge({status})).join('')}</div>${list.some(e=>e.status==='unknown')?'<p><strong>Data gap:</strong> one Downtown return trip remains unknown, not a failed connection.</p>':''}</section></div>`;}
function locations(list){const c=counts(list);return `<div class="coverage-strip"><div><strong>A clear picture, hub by hub.</strong><p>${list.length} sampled regional trips · ${hubs.filter(h=>list.some(e=>e.hub===h.id)).length} locations in view</p></div><div class="coverage-numbers"><span><b class="text-good">${c.good}</b>Comfortable</span><span><b class="text-tight">${c.tight}</b>Tight</span><span><b class="text-review">${c.review}</b>Review</span><span><b>${c.unknown}</b>Unknown</span></div></div><div class="hub-grid">${hubs.filter(h=>list.some(e=>e.hub===h.id)).map(h=>{const group=list.filter(e=>e.hub===h.id),c=counts(group);return `<section class="hub"><div class="hub-top"><div class="hub-icon" aria-hidden="true">${h.id==='downtown'?'⇄':'▤'}</div><h3 class="hub-title">${h.name}</h3><p class="hub-subtitle">${h.provider}</p><strong>${c.good} of ${group.length} sample trips comfortable</strong><div class="bar" aria-hidden="true">${Object.keys(labels).map(s=>`<span class="${s}" style="width:${c[s]/group.length*100}%"></span>`).join('')}</div><div class="hub-counts"><span>${c.tight} tight</span><span>${c.review} review</span><span>${c.unknown} not assessed</span></div></div><div class="hub-body">${['to','from'].filter(d=>group.some(e=>e.dir===d)).map(d=>{const subset=group.filter(e=>e.dir===d);return `<div class="direction-row"><span>${d==='to'?'To regional service':'From regional service'}</span><strong>${subset.filter(e=>e.status==='good').length} / ${subset.length} comfortable</strong></div>`;}).join('')}<div class="direction-row"><span>Walking allowance</span><strong>${h.walk} minutes</strong></div><div class="hub-note">${direction==='all'?h.note:`${group.filter(e=>e.status==='review'||e.status==='tight').length} timing issues and ${c.unknown} data gaps in this direction. ${c.good} trips have a comfortable transfer.`}</div><details><summary>See ${group.length} sample connections</summary>${group.map(e=>`<div class="hub-trip"><strong>${fmt(e.regional)} · ${e.service}</strong><p>Route ${e.route} · ${directionText(e)} · ${gapText(e)}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px">${badge(e)}${tripButton(e,'Details →')}</div></div>`).join('')}</details></div></section>`;}).join('')}</div><div class="section-heading"><h3>Management takeaway</h3></div>${takeaway(list)}`;}
function journeyDetail(e){const h=hubOf(e),w=wait(e);const start=e.dir==='to'?e.local:e.regional;const end=e.dir==='to'?e.regional:e.local;return `<div class="journey-head"><div class="eyebrow">${directionText(e)} · ${h.short}</div><h3>${e.dir==='to'?`Route ${e.route} → ${h.id==='downtown'?'LINX bus':'GO train'}`:`${h.id==='downtown'?'LINX bus':'GO train'} → Route ${e.route}`}</h3><p>${e.service} · Monday, October 5 · ${h.provider}</p></div><div class="journey-body"><div class="rider-line">${e.status==='unknown'?'The regional arrival is known, but the local departure is missing. This journey cannot yet be assessed.':e.dir==='to'?`A rider arrives on Route ${e.route} at <strong>${fmt(start)}</strong>, walks ${h.walk} minutes, then aims to catch the <strong>${fmt(end)}</strong> regional departure.`:`A rider arrives on regional service at <strong>${fmt(start)}</strong>, walks ${h.walk} minutes, then aims to board Route ${e.route} at <strong>${fmt(end)}</strong>.`}</div><div class="timeline"><div class="step"><time>${fmt(start)}</time><span class="dot" aria-hidden="true"></span><div><strong>${e.dir==='to'?`Arrive on local Route ${e.route}`:'Arrive on regional service'}</strong><p>${h.name} · sample arrival time</p></div></div><div class="step walk"><time>+${h.walk} min</time><span class="dot" aria-hidden="true"></span><div><strong>Walk to the departure point</strong><p>Ready to board at ${fmt(add(start,h.walk))} · assumed walk, not a verified path</p></div></div><div class="step"><time>${fmt(end)}</time><span class="dot" aria-hidden="true"></span><div><strong>${e.dir==='to'?'Regional service departs':e.local?`Local Route ${e.route} departs`:'Local departure not available'}</strong><p>${e.dir==='to'?e.service:e.local?'Sample master-schedule departure':'Requires planner confirmation'}</p></div></div></div><div class="result-box ${e.status}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>${w===null?'Not enough information':w<0?'Cannot make this transfer':w>20?`${w}-minute wait`:`${w} minutes remaining after walking`}</strong>${badge(e)}</div><p>${reason(e)}</p></div><p class="detail-note">Connection math: ${w===null?'local departure unavailable':`${e.dir==='to'?'regional departure − local arrival':'local departure − regional arrival'} − ${h.walk}-minute walk = ${w} minutes`}.<br>Sample stop pairing only. Static timetables do not guarantee an on-time or accessible transfer.</p></div>`;}
function journeys(list){if(!list.some(e=>e.id===selected))selected=list[0]?.id;return `<div class="coverage-strip"><div><strong>How does the transfer work for a rider?</strong><p>Select a connection to see arrival, walking time and the next departure.</p></div><span class="tiny muted">${list.length} sample connections · both services shown</span></div><div class="journey-layout"><section class="journey-list" aria-label="Sample connections"><div class="list-heading">Regional trip opportunities</div>${list.map(e=>`<button class="journey-option" data-journey="${e.id}" aria-pressed="${e.id===selected}"><div class="option-line"><strong>${hubOf(e).short}</strong><span class="tiny">${fmt(e.regional)}</span></div><p>${e.dir==='to'?'To':'From'} ${hubOf(e).id==='downtown'?'LINX':'GO'} · Route ${e.route}</p><div class="option-line">${badge(e)}<span class="tiny muted">${wait(e)===null?'Unknown':wait(e)<0?'Too late':`${wait(e)} min`}</span></div></button>`).join('')}</section><section class="journey-detail" id="journey-detail">${list.length?journeyDetail(list.find(e=>e.id===selected)):'<p class="empty">No sample connections in this selection.</p>'}</section></div>`;}
function render(){const list=visible();document.getElementById('content').innerHTML=variant===1?management(list):variant===2?locations(list):journeys(list);}
document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{direction=button.dataset.direction;document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();}));
document.getElementById('location').addEventListener('change',e=>{locationFilter=e.target.value;render();});
document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('detail-dialog').close());
document.getElementById('content').addEventListener('click',e=>{const detail=e.target.closest('[data-detail]');if(detail){document.getElementById('dialog-content').innerHTML=journeyDetail(events.find(x=>x.id===Number(detail.dataset.detail)));document.getElementById('detail-dialog').showModal();}const option=e.target.closest('[data-journey]');if(option){selected=Number(option.dataset.journey);document.querySelectorAll('[data-journey]').forEach(b=>b.setAttribute('aria-pressed',String(b===option)));document.getElementById('journey-detail').innerHTML=journeyDetail(events.find(x=>x.id===selected));}});
render();

</script></body></html>
