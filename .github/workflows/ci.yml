name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Ensure Env Files Are Not Tracked
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\\.)' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files detected:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies for Shared Tests
        run: npm ci --prefix functions

      - name: Lint (Non-Blocking)
        continue-on-error: true
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: '1'

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: [web, functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: '1'

      - name: Determine Firebase deploy targets
        id: firebase-targets
        shell: bash
        run: |
          before_sha="${{ github.event.before }}"
          current_sha="${{ github.sha }}"

          if [[ "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            changed_files="$(git ls-tree -r --name-only "$current_sha")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
          fi

          targets="functions:routePlannerGeocode,hosting"

          if grep -Eq '^(firestore\.rules|firebase\.json)$' <<< "$changed_files"; then
            targets="${targets},firestore:rules"
          fi

          if grep -Eq '^(storage\.rules|firebase\.json)$' <<< "$changed_files"; then
            targets="${targets},storage"
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Firebase deploy targets: $targets"

      - name: Deploy verified Firebase targets
        run: npx firebase-tools deploy --only "${{ steps.firebase-targets.outputs.targets }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
