name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Ensure Env Files Are Not Tracked
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files detected:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Documentation Context Check
        run: npm run docs:check

      - name: Install Functions Dependencies for Shared Tests
        run: npm ci --prefix functions

      - name: Lint Error Ratchet
        shell: bash
        env:
          LINT_ERROR_BASELINE: '41'
          LINT_WARNING_BASELINE: '247'
        run: |
          report="$RUNNER_TEMP/eslint-report.json"
          npx --no-install eslint . --format json > "$report" || true
          REPORT_PATH="$report" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const results = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const errors = results.reduce((total, result) => total + result.errorCount, 0);
          const warnings = results.reduce((total, result) => total + result.warningCount, 0);
          const errorBaseline = Number(process.env.LINT_ERROR_BASELINE);
          const warningBaseline = Number(process.env.LINT_WARNING_BASELINE);

          console.log(`ESLint found ${errors} errors and ${warnings} warnings; baselines are ${errorBaseline} errors and ${warningBaseline} warnings.`);
          if (!Number.isInteger(errorBaseline) || !Number.isInteger(warningBaseline)
              || errors > errorBaseline || warnings > warningBaseline) {
            console.error(`ESLint increased above the accepted baseline (${errorBaseline} errors, ${warningBaseline} warnings).`);
            process.exit(1);
          }
          NODE

      - name: Production Dependency Audit Ratchet
        shell: bash
        env:
          AUDIT_BASELINE_LOW: '0'
          AUDIT_BASELINE_MODERATE: '2'
          AUDIT_BASELINE_HIGH: '0'
          AUDIT_BASELINE_CRITICAL: '0'
        run: |
          report="$RUNNER_TEMP/npm-audit-root.json"
          npm audit --omit=dev --json > "$report" || true
          REPORT_PATH="$report" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('npm audit did not return vulnerability totals.');

          const severities = ['low', 'moderate', 'high', 'critical'];
          const increases = severities.filter((severity) => {
            const key = `AUDIT_BASELINE_${severity.toUpperCase()}`;
            return Number(counts[severity] ?? 0) > Number(process.env[key]);
          });

          console.log(`Production audit: ${severities.map((severity) => `${severity}=${counts[severity] ?? 0}`).join(', ')}.`);
          if (increases.length > 0) {
            console.error(`Production vulnerabilities increased above the accepted baseline for: ${increases.join(', ')}.`);
            process.exit(1);
          }
          NODE

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: '1'
          VITE_DEV_AUTH_AUTO_LOGIN: '0'

      - name: Install Chromium for Browser Smoke
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke (Public Access)
        run: node scripts/browserSmoke.mjs --public

      - name: Browser Smoke (Authenticated Dev Access When Configured)
        shell: bash
        env:
          VITE_DEMO_MODE: '1'
          VITE_DEV_AUTH_AUTO_LOGIN: '0'
          VITE_DEV_AUTH_EMAIL: ${{ secrets.VITE_DEV_AUTH_EMAIL }}
          VITE_DEV_AUTH_PASSWORD: ${{ secrets.VITE_DEV_AUTH_PASSWORD }}
          VITE_DEV_AUTH_TEAM_INVITE_CODE: ${{ secrets.VITE_DEV_AUTH_TEAM_INVITE_CODE }}
        run: |
          if [[ -z "$VITE_DEV_AUTH_EMAIL" && -z "$VITE_DEV_AUTH_PASSWORD" ]]; then
            echo "Authenticated browser smoke skipped: VITE_DEV_AUTH_EMAIL and VITE_DEV_AUTH_PASSWORD are not configured."
            exit 0
          fi
          if [[ -z "$VITE_DEV_AUTH_EMAIL" || -z "$VITE_DEV_AUTH_PASSWORD" ]]; then
            echo "Authenticated browser smoke requires both VITE_DEV_AUTH_EMAIL and VITE_DEV_AUTH_PASSWORD."
            exit 1
          fi
          npm run build
          node scripts/browserSmoke.mjs --authenticated

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Production Dependency Audit Ratchet
        shell: bash
        env:
          AUDIT_BASELINE_LOW: '0'
          AUDIT_BASELINE_MODERATE: '9'
          AUDIT_BASELINE_HIGH: '0'
          AUDIT_BASELINE_CRITICAL: '0'
        run: |
          report="$RUNNER_TEMP/npm-audit-functions.json"
          npm audit --omit=dev --json > "$report" || true
          REPORT_PATH="$report" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('npm audit did not return vulnerability totals.');

          const severities = ['low', 'moderate', 'high', 'critical'];
          const increases = severities.filter((severity) => {
            const key = `AUDIT_BASELINE_${severity.toUpperCase()}`;
            return Number(counts[severity] ?? 0) > Number(process.env[key]);
          });

          console.log(`Production audit: ${severities.map((severity) => `${severity}=${counts[severity] ?? 0}`).join(', ')}.`);
          if (increases.length > 0) {
            console.error(`Production vulnerabilities increased above the accepted baseline for: ${increases.join(', ')}.`);
            process.exit(1);
          }
          NODE

      - name: Build
        run: npm run build

  deploy:
    needs: [web, functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Build Web and Functions
        run: |
          npm run build
          npm run build --prefix functions
        env:
          VITE_DEMO_MODE: '1'

      - name: Determine Firebase deploy targets
        id: firebase-targets
        shell: bash
        run: |
          before_sha="${{ github.event.before }}"
          current_sha="${{ github.sha }}"

          if [[ "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            changed_files="$(git ls-tree -r --name-only "$current_sha")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
          fi

          targets="functions:routePlannerGeocode,hosting"

          if grep -Eq '^functions/' <<< "$changed_files"; then
            targets="functions,hosting"
          fi

          if grep -Eq '^(firestore\.rules|firebase\.json)$' <<< "$changed_files"; then
            targets="${targets},firestore:rules"
          fi

          if grep -Eq '^(storage\.rules|firebase\.json)$' <<< "$changed_files"; then
            targets="${targets},storage"
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Firebase deploy targets: $targets"

      - name: Deploy verified Firebase targets
        run: npx firebase-tools deploy --only "${{ steps.firebase-targets.outputs.targets }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
